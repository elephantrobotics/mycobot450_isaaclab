[package]

# Semantic Versioning is used: https://semver.org/
version = "0.1.0"

# Description
category = "isaaclab"
readme  = "README.md"

title = "MyCobot Pro450 Isaac Lab"
author = "Elephant Robotics"
maintainer = "Elephant Robotics"
description = "Isaac Lab Reach and Lift tasks for the MyCobot Pro450"
repository = "https://github.com/elephantrobotics/mycobot450_isaaclab"
keywords = ["extension", "mycobot", "isaaclab", "reach", "lift"]

[dependencies]
"isaaclab" = {}
"isaaclab_assets" = {}
"isaaclab_mimic" = {}
"isaaclab_rl" = {}
"isaaclab_tasks" = {}
# NOTE: Add additional dependencies here

[[python.module]]
name = "mycobot450_isaaclab"

# UI extension module: Kit imports this submodule directly and scans it for ``omni.ext.IExt``
# subclasses. Kept separate from the package root so ``import mycobot450_isaaclab`` stays omni-free headless.
[[python.module]]
name = "mycobot450_isaaclab.ui_extension_example"

